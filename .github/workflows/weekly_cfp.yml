name: Weekly CFP Tracker

on:
  schedule:
    # Monday 08:00 Asia/Taipei = Monday 00:00 UTC.
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/weekly_cfp.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Generate weekly journal report
        env:
          # Optional: raises the PubMed rate limit from 3/sec to 10/sec.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m scripts.fetch_cfps

      - name: Generate weekly conference deadlines
        run: python -m scripts.fetch_conferences

      - name: Commit report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data docs reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly CFP report $(date -u +'%Y-W%V')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

