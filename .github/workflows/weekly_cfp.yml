name: Weekly CFP Tracker

on:
  schedule:
    # Monday 08:00 Asia/Taipei = Monday 00:00 UTC.
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/weekly_cfp.yml"

# Pages is served from the branch (docs/ plus its CNAME for
# journals.yabilab.dev), so this workflow only needs to commit. Deploying the
# artifact from here as well fought with that branch build and failed, while
# the site published correctly anyway.
permissions:
  contents: write

concurrency:
  group: weekly-cfp
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Generate weekly journal report
        env:
          # Optional: raises the PubMed rate limit from 3/sec to 10/sec.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m scripts.fetch_cfps

      - name: Generate weekly conference deadlines
        run: python -m scripts.fetch_conferences

      - name: Commit report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data docs reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly CFP report $(date -u +'%Y-W%V')"
            git push
          fi
